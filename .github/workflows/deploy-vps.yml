# Auto-deploy to Hetzner VPS on push to main (runs infra/deploy/remote-deploy.sh over SSH).
#
# GitHub repo Secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST               e.g. 178.104.163.216
#   VPS_USER               e.g. deploy
#   VPS_SSH_PRIVATE_KEY    OpenSSH private key for VPS_USER (same as deploy key; never commit it).
#
# One-time on VPS:
#   git clone https://github.com/<you>/<repo>.git /home/deploy/ie-abishev-landing
#   sudo npm install -g pm2
# Git access: HTTPS (repo public or PAT on server) or SSH deploy key added to repo.

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/vps_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}" "cd /home/deploy/ie-abishev-landing && git fetch origin && git checkout main && git pull origin main && bash infra/deploy/remote-deploy.sh"
          rm -f ~/.ssh/vps_deploy
